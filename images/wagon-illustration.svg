<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 540" width="1376" height="540" role="img" aria-label="Illustration of the Sauna Wagon: a cream two-horse trailer with a brown Sauna Wagon livery band, steam clouds and pine sprigs">
  <defs>
    <style>
      .slab { font-family: 'Alfa Slab One', 'Rockwell', Georgia, serif; }
      .narrow { font-family: 'Archivo Narrow', 'Arial Narrow', 'Oswald', sans-serif; font-weight: 700; }
      .script { font-family: 'Kaushan Script', 'Brush Script MT', cursive; }
    </style>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9E4E4"/>
      <stop offset=".45" stop-color="#B7C9CA"/>
      <stop offset=".5" stop-color="#E6EEEE"/>
      <stop offset="1" stop-color="#9FB3B5"/>
    </linearGradient>
  </defs>

  <!-- ground line -->
  <line x1="30" y1="513" x2="1340" y2="513" stroke="#C9BFA6" stroke-width="2"/>

  <!-- tongue / A-frame -->
  <path d="M 300 382 L 62 456 L 62 472 L 300 400 Z" fill="#2E2016"/>
  <rect x="98" y="452" width="13" height="62" fill="#2E2016"/>
  <rect x="86" y="508" width="37" height="7" rx="2" fill="#2E2016"/>
  <path d="M 62 452 L 34 452 L 34 476 L 62 476 Z" fill="#3A3027"/>
  <rect x="300" y="392" width="52" height="12" fill="#2E2016"/>

  <!-- body shell -->
  <path d="M 300 400 L 300 176 C 300 152 312 140 336 136 L 690 116 C 900 104 1090 108 1196 124 C 1216 127 1224 139 1224 158 L 1224 400 Z" fill="#F2E8CE"/>
  <path d="M 300 400 L 300 176 C 300 152 312 140 336 136 L 690 116 C 900 104 1090 108 1196 124 C 1216 127 1224 139 1224 158 L 1224 400 Z" fill="none" stroke="#C9B98F" stroke-width="2"/>
  <path d="M 320 160 C 330 146 350 141 372 139 L 700 122 C 900 112 1080 116 1180 130" fill="none" stroke="#FBF6E9" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- upper chrome rail -->
  <path d="M 302 196 C 340 178 700 150 1222 168" fill="none" stroke="#B9B7B0" stroke-width="7" stroke-linecap="round"/>
  <path d="M 302 196 C 340 178 700 150 1222 168" fill="none" stroke="#EDEBE6" stroke-width="2" stroke-linecap="round"/>

  <!-- windows, glazed -->
  <rect x="326" y="200" width="84" height="52" rx="25" fill="url(#glass)" stroke="#2E2016" stroke-width="5"/>
  <rect x="432" y="192" width="264" height="56" rx="27" fill="url(#glass)" stroke="#2E2016" stroke-width="5"/>
  <rect x="716" y="182" width="230" height="56" rx="27" fill="url(#glass)" stroke="#2E2016" stroke-width="5"/>
  <rect x="966" y="178" width="230" height="56" rx="27" fill="url(#glass)" stroke="#2E2016" stroke-width="5"/>
  <!-- OPEN sign in the front window -->
  <rect x="340" y="213" width="56" height="26" rx="5" fill="#2E2016" opacity=".85"/>
  <text class="narrow" x="368" y="232" text-anchor="middle" font-size="16" letter-spacing="2" fill="#E2B95B">OPEN</text>

  <!-- forward door (existing horse-trailer escape door) -->
  <path d="M 314 396 L 314 194 L 420 190 L 420 396" fill="none" stroke="#C9B98F" stroke-width="2.5"/>
  <rect x="398" y="286" width="7" height="20" rx="3" fill="#9A968C"/>
  <!-- door oval: Rentals & Events -->
  <g transform="translate(366,342)">
    <ellipse cx="0" cy="0" rx="40" ry="18" fill="#C99B3F" stroke="#4E3222" stroke-width="2"/>
    <text class="script" x="0" y="4.5" text-anchor="middle" font-size="12.5" fill="#4E3222">Rentals &amp; Events</text>
  </g>

  <!-- lower chrome rail -->
  <path d="M 302 268 C 340 258 700 246 1222 254" fill="none" stroke="#B9B7B0" stroke-width="6" stroke-linecap="round"/>
  <path d="M 302 398 L 1222 398" fill="none" stroke="#B9B7B0" stroke-width="6" stroke-linecap="round"/>

  <!-- ============ LIVERY BAND ============ -->
  <g transform="translate(455,280)">
    <!-- pine sprigs -->
    <g stroke="#6E7D4B" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 40 86 C 26 70 18 52 22 30"/>
      <path d="M 22 30 l -10 -6 M 22 30 l 8 -9 M 24 40 l -11 -4 M 24 40 l 9 -8 M 28 52 l -12 -2 M 28 52 l 10 -7 M 33 64 l -12 0 M 33 64 l 10 -6 M 37 76 l -11 2 M 37 76 l 10 -4"/>
      <g transform="translate(730,0) scale(-1,1)">
        <path d="M 40 86 C 26 70 18 52 22 30"/>
        <path d="M 22 30 l -10 -6 M 22 30 l 8 -9 M 24 40 l -11 -4 M 24 40 l 9 -8 M 28 52 l -12 -2 M 28 52 l 10 -7 M 33 64 l -12 0 M 33 64 l 10 -6 M 37 76 l -11 2 M 37 76 l 10 -4"/>
      </g>
    </g>
    <!-- band -->
    <path d="M 60 6 Q 365 -6 670 6 Q 684 7 686 20 L 686 86 Q 684 100 670 101 Q 365 113 60 101 Q 46 100 44 86 L 44 20 Q 46 7 60 6 Z" fill="#4E3222" stroke="#C99B3F" stroke-width="2"/>
    <!-- clouds -->
    <g fill="#AEC3C5" stroke="#4E3222" stroke-width="2" stroke-linejoin="round">
      <path d="M 64 26 c -14 0 -22 -11 -14 -20 c 4 -13 20 -16 28 -7 c 6 -8 22 -7 25 4 c 14 -2 22 9 16 18 c 1 7 -6 11 -13 10 Z"/>
      <path d="M 666 92 c 14 0 22 11 14 20 c -4 13 -20 16 -28 7 c -6 8 -22 7 -25 -4 c -14 2 -22 -9 -16 -18 c -1 -7 6 -11 13 -10 Z"/>
    </g>
    <!-- lettering -->
    <text class="slab" x="365" y="58" text-anchor="middle" font-size="46" letter-spacing="3" fill="#F2E8CE">SAUNA WAGON</text>
    <text class="narrow" x="365" y="82" text-anchor="middle" font-size="16" letter-spacing="5" fill="#F2E8CE">MOBILE SAUNA</text>
    <path d="M 318 88 L 412 88 L 408 95 L 412 102 L 318 102 L 322 95 Z" fill="#C99B3F"/>
    <text class="narrow" x="365" y="99" text-anchor="middle" font-size="10" letter-spacing="2.5" fill="#4E3222">EST. 2026</text>
  </g>
  <!-- contact line under the band -->
  <text class="narrow" x="820" y="390" text-anchor="middle" font-size="17" letter-spacing="1.5" fill="#4E3222">www.saunawagon.ca  ·  (403) 809-1572</text>

  <!-- fender -->
  <path d="M 806 400 C 806 352 866 340 906 340 C 990 340 1062 352 1062 400 Z" fill="#F2E8CE" stroke="#C9B98F" stroke-width="2"/>

  <!-- wheels -->
  <circle cx="866" cy="455" r="58" fill="#232120"/>
  <circle cx="866" cy="455" r="34" fill="#DCD8CF"/>
  <circle cx="866" cy="455" r="15" fill="#B4AEA2"/>
  <circle cx="1006" cy="455" r="58" fill="#232120"/>
  <circle cx="1006" cy="455" r="34" fill="#DCD8CF"/>
  <circle cx="1006" cy="455" r="15" fill="#B4AEA2"/>

  <!-- roof lights -->
  <ellipse cx="640" cy="126" rx="16" ry="9" fill="#C08A2E"/>
  <ellipse cx="1206" cy="300" rx="9" ry="14" fill="#B0452C"/>
</svg>
